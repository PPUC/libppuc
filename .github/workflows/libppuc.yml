name: libppuc
on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION_MAJOR=$(grep -Eo "PPUC_VERSION_MAJOR\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+")
          VERSION_MINOR=$(grep -Eo "PPUC_VERSION_MINOR\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+")
          VERSION_PATCH=$(grep -Eo "PPUC_VERSION_PATCH\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+")
          TAG="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          echo "${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: depkey
        name: Compute dependency cache key
        run: |
          # See the build job for why IO_BOARDS_SHA is left out of the key.
          KEY=$( {
            grep -E '^(LIBSERIALPORT_SHA|YAML_CPP_SHA|DOCTEST_VERSION)=' platforms/config.sh
            cat platforms/linux/x64/external.sh
          } | git hash-object --stdin )
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
      - name: Cache third-party dependencies
        uses: actions/cache@v5
        with:
          path: |
            external
            third-party
          key: libppuc-deps-linux-x64-${{ steps.depkey.outputs.key }}
          restore-keys: |
            libppuc-deps-linux-x64-
      - name: Build and run unit tests
        run: |
          BUILD_TYPE=Release ./platforms/linux/x64/external.sh
          # The test target compiles the library sources directly, so neither
          # the shared nor the static library is needed here.
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=linux \
            -DARCH=x64 \
            -DBUILD_SHARED=OFF \
            -DBUILD_STATIC=OFF \
            -DBUILD_TESTS=ON \
            -B build-tests
          cmake --build build-tests -- -j$(nproc)
          ctest --test-dir build-tests --output-on-failure

  build:
    name: Build libppuc-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: [ version ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-mingw
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-latest
            platform: macos
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
      - id: depkey
        name: Compute dependency cache key
        run: |
          # Hash what decides whether a dependency must be rebuilt: the
          # third-party pins plus this platform's external.sh.
          #
          # IO_BOARDS_SHA is deliberately excluded. It changes on almost every
          # commit, but staging it is a handful of header copies, while
          # libserialport and yaml-cpp are compiled from source. Including it
          # would discard the cache to save no time - external.sh re-stages
          # io-boards on its own, because its cache.txt marker will not match.
          KEY=$( {
            grep -E '^(LIBSERIALPORT_SHA|YAML_CPP_SHA|DOCTEST_VERSION)=' platforms/config.sh
            cat platforms/${{ matrix.platform }}/${{ matrix.arch }}/external.sh
          } | git hash-object --stdin )
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
      - name: Cache third-party dependencies
        uses: actions/cache@v5
        with:
          # external/ holds the dependency source and build trees; third-party/
          # holds the headers and libraries staged out of them. Both are needed:
          # on a cache hit external.sh skips a dependency entirely, including
          # the step that copies its artifacts into third-party/.
          path: |
            external
            third-party
          key: libppuc-deps-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.depkey.outputs.key }}
          # A partial hit still helps: external.sh rebuilds only the
          # dependencies whose own cache.txt no longer matches.
          restore-keys: |
            libppuc-deps-${{ matrix.platform }}-${{ matrix.arch }}-
      - if: (matrix.platform == 'win-mingw')
        name: Set up MSYS2 MinGW (win runner)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            git
            libtool
            unzip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
      - if: (matrix.platform == 'macos')
        name: Add autoconf and automake (mac runner)
        run: |
           brew install autoconf automake libtool
      - if: (matrix.platform == 'win-mingw')
        name: Build libppuc-${{ matrix.platform }}-${{ matrix.arch }}
        shell: msys2 {0}
        run: |
          BUILD_TYPE=Release ./platforms/${{ matrix.platform }}/${{ matrix.arch }}/external.sh
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=${{ matrix.platform }} \
            -DARCH=${{ matrix.arch }} \
            -B build
          cmake --build build -- -j$(nproc)
      - if: (!(matrix.platform == 'linux' && matrix.arch == 'aarch64') && matrix.platform != 'win-mingw')
        name: Build libppuc-${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          BUILD_TYPE=Release ./platforms/${{ matrix.platform }}/${{ matrix.arch }}/external.sh
          if [[ "$(uname)" == "Darwin" ]]; then
             NUM_PROCS=$(sysctl -n hw.ncpu)
          else
             NUM_PROCS=$(nproc)
          fi
          cmake -DCMAKE_BUILD_TYPE=Release -DPLATFORM=${{ matrix.platform }} -DARCH=${{ matrix.arch }} -B build
          cmake --build build -- -j${NUM_PROCS}
      - if: (matrix.platform == 'linux' && matrix.arch == 'aarch64')
        name: Build libppuc-${{ matrix.platform }}-${{ matrix.arch }} (arm runner)
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          image_additional_mb: 4096
          cpu: cortex-a53
          cpu_info: cpuinfo/raspberrypi_zero2_w_arm64
          bind_mount_repository: true
          commands: |
            apt-get update -y --allow-releaseinfo-change
            apt-get install --no-install-recommends -y pkg-config cmake autoconf automake libtool
            BUILD_TYPE=Release ./platforms/${{ matrix.platform }}/${{ matrix.arch }}/external.sh
            NUM_PROCS=$(nproc)
            cmake -DCMAKE_BUILD_TYPE=Release -DPLATFORM=${{ matrix.platform }} -DARCH=${{ matrix.arch }} -B build
            cmake --build build -- -j${NUM_PROCS}
      - name: Prepare artifacts
        id: artifacts
        run: |
          mkdir tmp
          ARTIFACT_PATH="libppuc-${{ needs.version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          if [[ "${{ matrix.platform }}" == "win-mingw" ]]; then
            cp build/*.a tmp
            cp build/*.dll tmp
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            cp build/*.a tmp
            cp build/*.dylib tmp
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            cp build/*.a tmp
            cp build/*.so.* tmp
          fi
          cd tmp
          tar -czvf ../${ARTIFACT_PATH} *
          echo "artifact_path=${ARTIFACT_PATH}" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libppuc-${{ needs.version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.artifacts.outputs.artifact_path }}

  post-build:
    runs-on: macos-latest
    needs: [ version, build ]
    name: Build libppuc-macos
    steps:
      - uses: actions/download-artifact@v7
      - name: Unpack artifacts
        run: |
          cd libppuc-${{ needs.version.outputs.tag }}-macos-x64
          tar -xzvf libppuc-${{ needs.version.outputs.tag }}-macos-x64.tar.gz
          cd ..
          cd libppuc-${{ needs.version.outputs.tag }}-macos-arm64
          tar -xzvf libppuc-${{ needs.version.outputs.tag }}-macos-arm64.tar.gz
      - name: Combine macos architectures
        run: |
          mkdir tmp
          find "libppuc-${{ needs.version.outputs.tag }}-macos-arm64" -name "*.dylib" | while read -r file; do
            if [ -L "$file" ]; then
              cp -a "$file" "tmp/"
            elif [ -f "$file" ]; then
              filename=$(basename "$file")
              lipo -create -output "tmp/$filename" \
                "libppuc-${{ needs.version.outputs.tag }}-macos-arm64/$filename" \
                "libppuc-${{ needs.version.outputs.tag }}-macos-x64/$filename"
            fi
          done
      - name: Prepare artifacts
        run: |
          cd tmp
          tar -czvf ../libppuc-${{ needs.version.outputs.tag }}-macos.tar.gz *
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libppuc-${{ needs.version.outputs.tag }}-macos
          path: libppuc-${{ needs.version.outputs.tag }}-macos.tar.gz
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            libppuc-${{ needs.version.outputs.tag }}-win-mingw-x64/libppuc-${{ needs.version.outputs.tag }}-win-mingw-x64.tar.gz
            libppuc-${{ needs.version.outputs.tag }}-macos-arm64/libppuc-${{ needs.version.outputs.tag }}-macos-arm64.tar.gz
            libppuc-${{ needs.version.outputs.tag }}-macos-x64/libppuc-${{ needs.version.outputs.tag }}-macos-x64.tar.gz
            libppuc-${{ needs.version.outputs.tag }}-macos.tar.gz
            libppuc-${{ needs.version.outputs.tag }}-linux-x64/libppuc-${{ needs.version.outputs.tag }}-linux-x64.tar.gz
            libppuc-${{ needs.version.outputs.tag }}-linux-aarch64/libppuc-${{ needs.version.outputs.tag }}-linux-aarch64.tar.gz
